# Development.
#
#   ddns config:init --sample               # once, after cloning
#   docker compose -f compose.dev.yaml up
#
# The first command is not optional: config/ddns.yaml is the only file the
# application reads, and it is generated rather than committed, so that there
# is never a second configuration it might have answered from. --sample asks
# nothing and writes credentials of its own into .env.
#
# Source directories are bind-mounted, so editing a file under src/ takes
# effect on the next request - no rebuild. Rebuild only when composer.json or
# the Dockerfile changes:
#
#   docker compose -f compose.dev.yaml build
#
# Run the toolchain in the same image the app runs in:
#
#   docker compose -f compose.dev.yaml run --rm tools composer check
#   docker compose -f compose.dev.yaml run --rm tools composer test
#   docker compose -f compose.dev.yaml run --rm cli hosts:list
#
# A separate project name from compose.yaml, so a dev stack can never collide
# with a production one on the same host.
#
# Requires Compose v2.24 or newer, for `env_file: required:`.

name: ddns-dev

x-dev: &dev
  build:
    context: .
    target: dev
  image: ddns:dev
  environment:
    # ./config is bind-mounted below, so this is ./config/ddns.yaml on the
    # host - the same file the CLI reads there, reached through the mount that
    # already exists. The image's own default points at /config, which only
    # production mounts.
    DDNS_CONFIG: /app/config/ddns.yaml
    DDNS_LOG_LEVEL: ${DDNS_LOG_LEVEL:-DEBUG}
  env_file:
    - path: .env
      required: false
  volumes:
    # Only the source is mounted. vendor/ stays as the image built it, so a
    # host-side install cannot shadow it with the wrong platform's binaries.
    - ./src:/app/src
    - ./tests:/app/tests
    - ./config:/app/config
    - ./public:/app/public
    - ./bin:/app/bin

# The configuration is required, and saying so as a bind means a clone that has
# not run `config:init --sample` yet is told by Docker, at once, which file is
# missing. create_host_path is off because Docker would otherwise create a
# *directory* with that name and the container would fail on a parse error
# instead.
#
# Only on the services you `up`. `tools` and `cli` are how you create the file
# in the first place - `run --rm cli config:init --sample` - so requiring it
# there would leave nothing able to start until something else had already run.
x-config: &config
  type: bind
  source: ./config/ddns.yaml
  target: /app/config/ddns.yaml
  read_only: true
  bind:
    create_host_path: false

services:
  server:
    <<: *dev
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config
      - ./public:/app/public
      - ./bin:/app/bin
      - *config
    ports:
      - "${DDNS_DEV_PORT:-8080}:8080"
    # No restart policy: a crash should stay visible rather than loop.

  watcher:
    <<: *dev
    profiles: ["watcher"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config
      - ./public:/app/public
      - ./bin:/app/bin
      - *config
    # A short interval and verbose output, to actually see the loop working.
    command: ["bin/ddns", "watch", "--all", "--interval", "30", "-v"]
    healthcheck:
      disable: true

  # `run --rm tools <command>` - PHPUnit, PHPStan, PHP-CS-Fixer, Composer.
  tools:
    <<: *dev
    profiles: ["tools"]
    command: ["composer", "check"]
    environment:
      DDNS_CONFIG: /app/config/ddns.yaml
      DDNS_LOG_LEVEL: ERROR
      # The image runs a newer PHP than the composer.json floor, which
      # PHP-CS-Fixer warns about and would otherwise fail CI-style runs.
      PHP_CS_FIXER_IGNORE_ENV: "1"

  # `run --rm cli config:init --sample`, then `run --rm cli update --all --dry-run`
  cli:
    <<: *dev
    profiles: ["tools"]
    entrypoint: ["bin/ddns"]
    command: ["list"]
