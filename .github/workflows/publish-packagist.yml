# Publish to Packagist.
#
# Runs on its own, as a separate workflow run from the Docker image's,
# whenever release.yml publishes a GitHub release. Neither publish workflow
# can block the other, or block release.yml from creating the next release -
# each is its own run, with its own concurrency group.
#
# Woken up two ways. `release: published` fires when a release is made by
# hand through the GitHub UI - a real user's action, which GitHub is happy to
# have trigger other workflows. release.yml's own releases do not arrive this
# way: it creates them with the implicit GITHUB_TOKEN, and GitHub does not
# let a GITHUB_TOKEN-authored event trigger other workflows, precisely to
# stop an infinite loop - it just also means this workflow's real trigger
# would silently never fire. workflow_dispatch is the documented exception
# (it always starts a run, whoever's token requested it), so release.yml
# calls this workflow explicitly instead of relying on the event reaching it.
# `tag` is accepted only so release.yml can dispatch all three publish
# workflows the same way - Packagist is not told which tag prompted it, since
# it re-reads the repository rather than a specific release.
#
# ---------------------------------------------------------------------------
# Gated on the repository variable RELEASE_ENABLED. Set it to `false` (or
# delete it) under Settings -> Secrets and variables -> Actions -> Variables
# to turn this workflow back off, e.g. while rotating credentials.
# ---------------------------------------------------------------------------
#
# What it wants before it will do anything useful:
#
#   RELEASE_ENABLED     variable   `true`, or the job skips
#   PACKAGIST_USERNAME  secret     omit to rely on Packagist's GitHub App
#   PACKAGIST_TOKEN     secret     from https://packagist.org/profile/

name: Publish to Packagist

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Unused - accepted so release.yml can dispatch all three publish workflows uniformly."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-packagist
  cancel-in-progress: false

jobs:
  packagist:
    name: Notify Packagist
    runs-on: ubuntu-latest
    if: vars.RELEASE_ENABLED == 'true'

    env:
      HAS_PACKAGIST: ${{ secrets.PACKAGIST_USERNAME != '' }}

    steps:
      # Packagist reads the tag from GitHub itself, so this only tells it to
      # look now rather than whenever it next gets round to it. With the
      # Packagist GitHub App installed the hook already fires and this is a
      # harmless second nudge - which is why it skips, rather than fails, when
      # there are no credentials for it.
      #
      # There is deliberately no `version` field in composer.json: Packagist
      # derives the version from the tag, and a field that disagreed with the
      # tag would be believed over it.
      - name: Ask Packagist to update
        if: env.HAS_PACKAGIST == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          status="$(curl -sS -o /tmp/packagist.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"repository\":{\"url\":\"https://github.com/${REPOSITORY}\"}}" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}")"

          cat /tmp/packagist.json
          echo

          test "$status" = "202" || {
            echo "Packagist answered $status." >&2
            exit 1
          }

      - name: Say why nothing happened
        if: env.HAS_PACKAGIST != 'true'
        run: |
          {
            echo "### Packagist"
            echo
            echo "No PACKAGIST_USERNAME is set, so nothing was pushed."
            echo "Packagist picks the tag up on its own when its GitHub App is installed."
          } >> "$GITHUB_STEP_SUMMARY"
