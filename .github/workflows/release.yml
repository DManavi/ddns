# Release.
#
# Creates a GitHub release every time main is pushed to - directly, or by
# merging a pull request - as long as the change is more than docs, chore,
# ci, style or test tweaks. Publishing the result is somebody else's job:
# after creating the release, the last step explicitly starts publish-ghcr.yml,
# publish-dockerhub.yml and publish-packagist.yml (see that step for why a
# release created here cannot just rely on those workflows' own `release:
# published` trigger), so any of the three can succeed, fail or queue
# independently of the others and of this workflow.
#
# ---------------------------------------------------------------------------
# Gated on the repository variable RELEASE_ENABLED. Set it to `false` (or
# delete it) under Settings -> Secrets and variables -> Actions -> Variables
# to turn every job here back off, e.g. while rotating credentials.
# ---------------------------------------------------------------------------
#
# What it wants before it will do anything useful:
#
#   RELEASE_ENABLED     variable   `true`, or every job skips
#
# (Docker Hub, GHCR and Packagist credentials live in, and are read by,
# publish-ghcr.yml, publish-dockerhub.yml and publish-packagist.yml instead -
# this workflow only ever needs the implicit GITHUB_TOKEN, to push the tag
# and create the release.)
#
# How the version is decided:
#
#   Whether a release happens at all is still decided by
#   .github/scripts/next-version.php - unchanged, and still driven by
#   Conventional Commits: a `!` or a BREAKING CHANGE footer, `feat`, `fix`
#   and friends all release; a push made only of docs, chore, ci, style or
#   test commits does not. What changed is what the release is *called*:
#   every release is tagged `1.<date>.<time>`, in UTC, rather than the
#   semver number next-version.php computes internally - that number now
#   only ever decides release-or-not, and is surfaced in the run summary for
#   context.
#
# A push reads the commits it actually introduced (merge commits excluded -
# see the "Collect what this push changed" step for why); workflow_dispatch
# is always treated as a release, same as before.
#
# The rules live in .github/scripts/next-version.php, which carries its own
# test cases and is made to prove them below before it is trusted.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the one job that writes says so itself.
permissions:
  contents: read

# One release at a time, and never cancelled: a run interrupted between the
# tag and the push would leave a version that exists in git and nowhere else.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest

    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')

    outputs:
      # `previous` and `bump` come straight from next-version.php; its own
      # `version` output (a semver bump) is deliberately not used here - the
      # tag is always `date`'s.
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.date.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      bump: ${{ steps.version.outputs.bump }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are where the previous version is read from, and the commits
          # a push introduced are found by diffing against `before` - a
          # shallow clone has neither.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # The script decides whether a release happens at all, so it proves
      # itself first. It lives outside src/, where neither PHPStan nor the
      # test suite reaches it - the containerised toolchain runs against a
      # tree with no .github in it, so adding it to their paths would break
      # `composer check` there.
      - name: Test the version rules
        run: php .github/scripts/next-version.php --self-test

      # The newest release tag, falling back to the constant the application
      # reports, for the first release when no tag exists yet.
      - name: Find the current version
        id: current
        run: |
          set -euo pipefail

          # Version-aware sorting, so v10 beats v9 rather than losing to it
          # alphabetically. The grep is what the glob cannot express: only a
          # bare MAJOR.MINOR.PATCH counts, so a prerelease or a nightly tag
          # sitting in the same repository is not mistaken for the last
          # release.
          tag="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)"

          if [ -n "$tag" ]; then
            current="${tag#v}"
            echo "Latest release tag: $tag"
          else
            current="$(php -r 'require "src/Bootstrap.php"; echo Ddns\Bootstrap::VERSION;')"
            echo "No release tag yet, so starting from Bootstrap::VERSION: $current"
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"

      # next-version.php only knows how to read a "pull_request"-shaped JSON
      # (title + commits) - a push has no pull request to ask, so the commits
      # it actually introduced are read directly and shaped the same way
      # `gh pr view --json commits` used to. --no-merges drops the synthetic
      # "Merge pull request #N ..." commit a "create a merge commit" merge
      # adds: it is not a Conventional Commit and would otherwise force at
      # least a patch on every such merge, docs-only or not, which is not
      # what the pull-request path ever saw either.
      - name: Collect what this push changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # A brand-new ref has an all-zero "before" and nothing to diff
          # against; fall back to just the tip commit.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            range=(-1 "$AFTER")
          else
            range=("$BEFORE..$AFTER")
          fi

          commits_json='[]'
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            headline="$(git show -s --format='%s' "$sha")"
            body="$(git show -s --format='%b' "$sha")"
            commits_json="$(jq -c --arg h "$headline" --arg b "$body" \
              '. + [{"messageHeadline": $h, "messageBody": $b}]' <<< "$commits_json")"
          done < <(git log --no-merges --format='%H' "${range[@]}")

          jq -n --argjson commits "$commits_json" '{commits: $commits}' > "$RUNNER_TEMP/pr.json"

      - name: Work out whether to release
        id: version
        env:
          CURRENT: ${{ steps.current.outputs.current }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            php .github/scripts/next-version.php \
              --current="$CURRENT" \
              --event=workflow_dispatch | tee -a "$GITHUB_OUTPUT"
          else
            # The script itself is unchanged; only what feeds it differs. A
            # push is handed the JSON built above through the same
            # "pull_request" path `gh pr view` used to feed.
            php .github/scripts/next-version.php \
              --current="$CURRENT" \
              --event=pull_request \
              --pr-json="$RUNNER_TEMP/pr.json" | tee -a "$GITHUB_OUTPUT"
          fi

      # The version actually tagged, independent of the bump next-version.php
      # computed above - that number now only ever decides release-or-not.
      - name: Work out the release version
        id: date
        run: |
          set -euo pipefail
          now="$(date -u +%Y%m%d%H%M)"
          echo "version=1.${now:0:8}.${now:8:4}" >> "$GITHUB_OUTPUT"

      - name: Say what will happen
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          VERSION: ${{ steps.date.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          set -euo pipefail

          if [ "$RELEASE" = "true" ]; then
            {
              echo "### Releasing \`$VERSION\`"
              echo
              echo "A change of at least \`$BUMP\` since \`$PREVIOUS\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No release"
              echo
              echo "Nothing here changes what anyone can install, so \`$PREVIOUS\` stands."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.release == 'true'

    permissions:
      # To push the version bump and the tag that points at it, and to
      # create the release itself.
      contents: write
      # To start the publish workflows with workflow_dispatch afterwards -
      # see the last step for why that's needed instead of relying on their
      # `release: published` trigger.
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit, rather than relying on the triggering ref: a manual run
          # can be launched against any branch, and this job always pushes to
          # main regardless of which one that was.
          ref: main
          fetch-depth: 0

      # Two qualifying pushes landing in the same UTC minute would otherwise
      # collide silently on the same tag.
      - name: Ensure this version has not already been released
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists - two releases landed in the same minute." >&2
            echo "Re-run once the next minute begins." >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, xml, pcntl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist"

      # Bootstrap::VERSION is what `ddns --version` and the OpenAPI document
      # report, so a tag it disagreed with would leave the running application
      # lying about which release it is. The value is a version this workflow
      # computed, so it is safe to substitute; the read-back is what catches a
      # replacement that silently matched nothing.
      - name: Set the version the application reports
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          matches="$(grep -c "public const VERSION = '" src/Bootstrap.php || true)"
          test "$matches" = "1" || {
            echo "Expected exactly one VERSION constant in src/Bootstrap.php, found $matches." >&2
            echo "The constant was probably renamed; this workflow needs updating with it." >&2
            exit 1
          }

          sed -i "s/public const VERSION = '[^']*';/public const VERSION = '${VERSION}';/" src/Bootstrap.php

          actual="$(php -r 'require "src/Bootstrap.php"; echo Ddns\Bootstrap::VERSION;')"
          test "$actual" = "$VERSION" || {
            echo "Bootstrap::VERSION is $actual, expected $VERSION." >&2
            exit 1
          }

      # The version is compiled into the OpenAPI document and the console
      # banner, so the suite runs against the value being tagged rather than
      # the one that was tested before this push.
      - name: Test at the version being released
        run: vendor/bin/phpunit

      - name: Commit and tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Already at the right version if someone bumped it by hand, and that
          # is not a reason to fail the release. [skip ci] matters more now
          # than it used to: this workflow triggers on every push to main, and
          # this step's own commit is one. GITHUB_TOKEN pushes do not start new
          # workflow runs on their own, but [skip ci] is belt and braces on
          # top of that.
          if git diff --quiet -- src/Bootstrap.php; then
            echo "Bootstrap::VERSION already reads $VERSION; nothing to commit."
          else
            git commit -m "chore(release): v${VERSION} [skip ci]" -- src/Bootstrap.php
          fi

          # Annotated, because Packagist and `git describe` both prefer one.
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin main --follow-tags

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --verify-tag

      # `gh release create` above used GITHUB_TOKEN, and GitHub does not let a
      # GITHUB_TOKEN-authored event trigger other workflows - the same rule
      # that stops this job's own push from re-running this workflow also
      # means the `release: published` event the publish workflows listen for
      # never reaches them. workflow_dispatch is the documented exception: it
      # always starts a run, whoever's token requested it, so the publish
      # workflows are woken up explicitly instead of relying on an event that
      # would otherwise never arrive.
      - name: Fire the publish workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          for workflow in publish-ghcr.yml publish-dockerhub.yml publish-packagist.yml; do
            gh workflow run "$workflow" --ref main -f "tag=v${VERSION}"
          done

