# Publish the Docker image to GitHub Container Registry.
#
# Runs on its own, as a separate workflow run from Docker Hub's and
# Packagist's, whenever release.yml publishes a GitHub release. None of the
# publish workflows can block each other, or block release.yml from creating
# the next release - each is its own run, with its own concurrency group.
#
# ghcr.io needs nothing beyond the implicit GITHUB_TOKEN, so this workflow
# has no optional secret to skip around: with RELEASE_ENABLED on, it always
# publishes. That is also why it is split from Docker Hub's workflow rather
# than sharing one build-and-push step with it - a single `docker buildx
# build --push` pushing tags on two registries fails as a whole if either
# registry rejects it, so a Docker Hub credential problem would otherwise be
# able to stop ghcr.io publishing too, for a registry that needs no
# credentials of its own to begin with.
#
# Woken up two ways. `release: published` fires when a release is made by
# hand through the GitHub UI - a real user's action, which GitHub is happy to
# have trigger other workflows. release.yml's own releases do not arrive this
# way: it creates them with the implicit GITHUB_TOKEN, and GitHub does not
# let a GITHUB_TOKEN-authored event trigger other workflows, precisely to
# stop an infinite loop - it just also means this workflow's real trigger
# would silently never fire. workflow_dispatch is the documented exception
# (it always starts a run, whoever's token requested it), so release.yml
# calls this workflow explicitly with the tag it just created instead of
# relying on the event reaching it. `tag` is what tells the two apart: a
# release event carries its own, so the input is only read when it doesn't.
#
# ---------------------------------------------------------------------------
# Gated on the repository variable RELEASE_ENABLED. Set it to `false` (or
# delete it) under Settings -> Secrets and variables -> Actions -> Variables
# to turn this workflow back off, e.g. while rotating credentials.
# ---------------------------------------------------------------------------
#
# What it wants before it will do anything useful:
#
#   RELEASE_ENABLED   variable   `true`, or the job skips
#
# Tags are built directly from the release's version (full version,
# major.minor, major, latest) rather than parsed by docker/metadata-action's
# `type=semver` pattern: that pattern enforces strict SemVer, which forbids a
# leading zero in any component, and the time-based patch release.yml
# produces (e.g. `0805` for 08:05 UTC) has one roughly forty percent of the
# time. A pattern match that silently drops a tag on forty percent of
# releases is worse than not using the pattern at all.

name: Publish to GitHub Container Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.20260818.2157). Defaults to the latest release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  ghcr:
    name: Build and push
    runs-on: ubuntu-latest
    if: vars.RELEASE_ENABLED == 'true'

    permissions:
      contents: read
      # To push to ghcr.io under this repository's owner.
      packages: write

    steps:
      # A release event carries its own tag; workflow_dispatch reads the
      # input instead, falling back to the latest release when it's blank
      # too - so a manual run with nothing filled in still does something
      # useful, which is retry the most recent publish.
      - name: Resolve which release to publish
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "$EVENT_TAG" ]; then
            tag="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # The tag, so the image is built from exactly what was released -
          # including the version constant release.yml wrote before tagging.
          ref: ${{ steps.release.outputs.tag }}

      # arm64 is emulated, which is slower than the native build and is what
      # makes the image usable on a Raspberry Pi - where a good deal of
      # self-hosted dynamic DNS actually runs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased, because a repository owner may be capitalised and a
      # registry reference may not be.
      #
      # 1.20260818.2157, 1.20260818 and 1 all move to the newest release that
      # matches, so a deployment can choose how much change it is willing to
      # accept. See the top of this file for why these are built by hand
      # rather than matched as semver.
      - name: Work out the tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${slug}"

          version="${TAG#v}"   # 1.20260818.2157
          date="${version%.*}" # 1.20260818
          major="${date%%.*}"  # 1

          {
            echo 'tags<<TAGS'
            echo "${image}:${version}"
            echo "${image}:${date}"
            echo "${image}:${major}"
            echo "${image}:latest"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `dev` is the last stage in the Dockerfile, so the target has to be
      # named explicitly or this would publish the development image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ddns
            org.opencontainers.image.description=Self-hosted dynamic DNS server
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say where it went
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            printf '%s\n' '${{ steps.tags.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
