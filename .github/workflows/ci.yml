name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, xml, pcntl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist"

      # Not --strict: it rejects exact version constraints on principle, and
      # ours are deliberate. Plain validate still fails when composer.json and
      # composer.lock disagree, which is the check that matters here - it stops
      # a dependency being changed without the lock being regenerated.
      - name: Validate composer.json and lock
        run: composer validate

      # Pinning keeps the dependency set fixed, so something has to notice when
      # a pinned version later turns out to be vulnerable. --locked audits what
      # is actually installed rather than what the constraints permit.
      - name: Audit dependencies for known advisories
        run: composer audit --locked

      - name: Check formatting
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: Validate the example configuration
        run: |
          cp config/ddns.example.yaml /tmp/ddns.yaml
          DO_TOKEN=ci-placeholder-token \
          HOME_TOKEN=ci-placeholder-host-token \
          php bin/ddns config:validate /tmp/ddns.yaml

      # The release workflow is gated off until there are accounts to publish
      # to, so nothing else would exercise the rules that decide a version
      # until the day they are first trusted with one. They sit outside src/,
      # where PHPStan and PHPUnit cannot reach them, and carry their own cases
      # instead.
      - name: Test the release version rules
        run: php .github/scripts/next-version.php --self-test

      # The release workflow rewrites this constant with sed before tagging.
      # Renaming it would leave the released application reporting the previous
      # version, so the shape it matches on is checked here rather than
      # discovered during a release.
      - name: Confirm the version constant is where the release expects it
        run: |
          matches="$(grep -c "public const VERSION = '" src/Bootstrap.php || true)"
          test "$matches" = "1" || {
            echo "Expected exactly one VERSION constant, found $matches." >&2
            echo "See .github/workflows/release.yml, which rewrites it." >&2
            exit 1
          }

      # The README's PHP badge is static, so that it says something true before
      # the package is published rather than reading "not found" from Packagist.
      # The price of that is drift, which this is here to prevent.
      - name: Confirm the PHP badge matches composer.json
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016  # $c and $m are PHP variables; the
          # single quotes are what keeps the shell out of them.
          required="$(php -r '
            $c = json_decode(file_get_contents("composer.json"), true);
            preg_match("/(\d+\.\d+)/", $c["require"]["php"], $m);
            echo $m[1];
          ')"

          grep -qF "img.shields.io/badge/php-${required}%2B-" README.md || {
            echo "composer.json requires PHP ${required}, which the README badge does not say." >&2
            grep -o 'img.shields.io/badge/php-[^)]*' README.md >&2 || true
            exit 1
          }

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The default `docker` driver cannot export a build cache, so the GitHub
      # Actions cache below needs the container driver buildx sets up here.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `dev` is the last stage in the Dockerfile, so the target has to be
      # named explicitly or this would build the development image.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ddns:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the CLI inside the production image
        run: docker run --rm ddns:ci bin/ddns providers:list

      - name: Confirm the production image runs as a non-root user
        run: test "$(docker run --rm ddns:ci id -u)" = "1000"

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: ddns:ci-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the dev image is actually usable: vendor, dev dependencies and
      # source all line up inside it.
      - name: Run the test suite inside the development image
        run: docker run --rm ddns:ci-dev vendor/bin/phpunit

  compose:
    name: Compose files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Both stacks must parse, and production must not accidentally start the
      # watcher alongside the server.
      - name: Validate the production stack
        run: |
          docker compose -f compose.yaml config --quiet
          test "$(docker compose -f compose.yaml config --services)" = "server"

      - name: Validate the development stack
        run: |
          docker compose -f compose.dev.yaml config --quiet
          test "$(docker compose -f compose.dev.yaml config --services)" = "server"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # pcov rather than Xdebug: it exists to do this one thing, and does it
      # several times faster on a suite this size.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, xml, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist"

      # The script decides what the badge claims, so it proves itself first.
      - name: Test the coverage rules
        run: php .github/scripts/coverage-badge.php --self-test

      - name: Measure coverage
        run: composer test:coverage

      # Writes the shields.io endpoint document the README badge reads. On a
      # pull request this only reports; the commit below happens on main.
      - name: Work out the percentage
        id: coverage
        run: |
          set -euo pipefail
          php .github/scripts/coverage-badge.php \
            --clover=build/coverage.xml \
            --badge=.github/badges/coverage.json | tee -a "$GITHUB_OUTPUT"

      - name: Report it
        env:
          PERCENT: ${{ steps.coverage.outputs.percent }}
          COVERED: ${{ steps.coverage.outputs.covered }}
          TOTAL: ${{ steps.coverage.outputs.total }}
        run: |
          {
            echo "### Coverage"
            echo
            echo "\`$PERCENT%\` — $COVERED of $TOTAL statements."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/coverage.xml
          retention-days: 14

  badge:
    name: Publish the coverage badge
    runs-on: ubuntu-latest
    needs: coverage
    # Only from main, and never from a fork's pull request, which has no write
    # access and no business moving the number the README shows.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      # To commit .github/badges/coverage.json when the number moves.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, xml, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist"

      - name: Measure coverage
        run: composer test:coverage

      - name: Rewrite the badge
        run: |
          php .github/scripts/coverage-badge.php \
            --clover=build/coverage.xml \
            --badge=.github/badges/coverage.json

      # Committed rather than uploaded somewhere, so the badge needs no account
      # anywhere and no token beyond this one. [skip ci] is belt and braces: a
      # push made with GITHUB_TOKEN does not start another workflow.
      - name: Commit it when the number moved
        run: |
          set -euo pipefail

          # Staged first, then compared against the index: `git diff` alone is
          # blind to an untracked file, so a badge that had been deleted would
          # be regenerated and then silently not committed.
          git add .github/badges/coverage.json

          if git diff --cached --quiet -- .github/badges/coverage.json; then
            echo "Coverage is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update the coverage badge [skip ci]" -- .github/badges/coverage.json

          # The release workflow also pushes to main, and the two can land
          # together. Rebasing beats failing over a generated file.
          git pull --rebase --autostash origin main
          git push origin main
