# Publish the Docker image to Docker Hub.
#
# Runs on its own, as a separate workflow run from GHCR's and Packagist's,
# whenever release.yml publishes a GitHub release. None of the publish
# workflows can block each other, or block release.yml from creating the
# next release - each is its own run, with its own concurrency group.
#
# Split from the GHCR workflow rather than sharing one build-and-push step
# with it - a single `docker buildx build --push` pushing tags on two
# registries fails as a whole if either registry rejects it, so a problem
# here would otherwise be able to stop ghcr.io publishing too, for a
# registry that needs no credentials of its own to begin with.
#
# Woken up two ways. `release: published` fires when a release is made by
# hand through the GitHub UI - a real user's action, which GitHub is happy to
# have trigger other workflows. release.yml's own releases do not arrive this
# way: it creates them with the implicit GITHUB_TOKEN, and GitHub does not
# let a GITHUB_TOKEN-authored event trigger other workflows, precisely to
# stop an infinite loop - it just also means this workflow's real trigger
# would silently never fire. workflow_dispatch is the documented exception
# (it always starts a run, whoever's token requested it), so release.yml
# calls this workflow explicitly with the tag it just created instead of
# relying on the event reaching it. `tag` is what tells the two apart: a
# release event carries its own, so the input is only read when it doesn't.
#
# ---------------------------------------------------------------------------
# Gated on the repository variable RELEASE_ENABLED. Set it to `false` (or
# delete it) under Settings -> Secrets and variables -> Actions -> Variables
# to turn this workflow back off, e.g. while rotating credentials.
# ---------------------------------------------------------------------------
#
# What it wants before it will do anything useful:
#
#   RELEASE_ENABLED     variable   `true`, or the job skips
#   DOCKERHUB_USERNAME  secret     omit to skip this workflow entirely
#   DOCKERHUB_TOKEN     secret     an access token, not the account password
#
# Tags are built directly from the release's version (full version,
# major.minor, major, latest) rather than parsed by docker/metadata-action's
# `type=semver` pattern: that pattern enforces strict SemVer, which forbids a
# leading zero in any component, and the time-based patch release.yml
# produces (e.g. `0805` for 08:05 UTC) has one roughly forty percent of the
# time. A pattern match that silently drops a tag on forty percent of
# releases is worse than not using the pattern at all.

name: Publish to Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.20260818.2157). Defaults to the latest release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-dockerhub
  cancel-in-progress: false

jobs:
  dockerhub:
    name: Build and push
    runs-on: ubuntu-latest
    if: vars.RELEASE_ENABLED == 'true'

    # The `secrets` context cannot be used in an `if:`, but it can be used
    # here, and `env` can. This is the usual way to make a step conditional on
    # a credential existing - and here, every step after checkout.
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      # A release event carries its own tag; workflow_dispatch reads the
      # input instead, falling back to the latest release when it's blank
      # too - so a manual run with nothing filled in still does something
      # useful, which is retry the most recent publish.
      - name: Resolve which release to publish
        if: env.HAS_DOCKERHUB == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "$EVENT_TAG" ]; then
            tag="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: env.HAS_DOCKERHUB == 'true'
        with:
          # The tag, so the image is built from exactly what was released -
          # including the version constant release.yml wrote before tagging.
          ref: ${{ steps.release.outputs.tag }}

      # arm64 is emulated, which is slower than the native build and is what
      # makes the image usable on a Raspberry Pi - where a good deal of
      # self-hosted dynamic DNS actually runs.
      - name: Set up QEMU
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Lowercased, because a repository owner may be capitalised and a
      # Docker Hub repository name may not be.
      #
      # 1.20260818.2157, 1.20260818 and 1 all move to the newest release that
      # matches, so a deployment can choose how much change it is willing to
      # accept. See the top of this file for why these are built by hand
      # rather than matched as semver.
      - name: Work out the tags
        if: env.HAS_DOCKERHUB == 'true'
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          version="${TAG#v}"   # 1.20260818.2157
          date="${version%.*}" # 1.20260818
          major="${date%%.*}"  # 1

          {
            echo 'tags<<TAGS'
            echo "${image}:${version}"
            echo "${image}:${date}"
            echo "${image}:${major}"
            echo "${image}:latest"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `dev` is the last stage in the Dockerfile, so the target has to be
      # named explicitly or this would publish the development image.
      - name: Build and push
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ddns
            org.opencontainers.image.description=Self-hosted dynamic DNS server
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Repository-level metadata rather than image-level: the description and
      # category shown on the Docker Hub page live on the repository, not in a
      # tag's manifest, so there is no `docker build`/`docker push` equivalent
      # for either - this is the same `/v2/auth/token` + `/v2/repositories/...`
      # API the Docker Hub UI itself uses. Repeated on every publish rather
      # than done once by hand: it costs nothing to repeat, and self-heals if
      # either is ever changed by hand on Docker Hub.
      #
      # continue-on-error, deliberately: Docker Hub scopes this endpoint
      # separately from `docker push` - a token good enough to publish the
      # image can still get a flat 403 "insufficient scope" here, even though
      # the account itself has full admin rights on the repository (confirmed
      # live; see forums.docker.com/t/insufficient-scope-for-advanced-image-
      # management-api/122909 for the same report from someone else's token).
      # DOCKERHUB_TOKEN needs "Read, Write, Delete" scope, not just "Read &
      # Write", for this step specifically. A cosmetic metadata update failing
      # is not a reason to fail the actual publish above; the step still shows
      # as failed in the run so the gap stays visible until the token is
      # reissued with the right scope.
      - name: Set the Docker Hub description and category
        if: env.HAS_DOCKERHUB == 'true'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          token="$(curl -sS -X POST https://hub.docker.com/v2/auth/token \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
              '{identifier: $u, secret: $p}')" \
            | jq -r '.access_token')"

          body="$(jq -n \
            --arg description 'Self-hosted dynamic DNS server: DigitalOcean, Vultr, Cloudflare, Azure DNS, Route53. HTTP + CLI.' \
            '{description: $description, categories: ["networking"]}')"

          status="$(curl -sS -o /tmp/dockerhub-repo.json -w '%{http_code}' \
            -X PATCH "https://hub.docker.com/v2/repositories/${repo}" \
            --oauth2-bearer "$token" \
            -H 'Content-Type: application/json' \
            --data "$body")"

          cat /tmp/dockerhub-repo.json
          echo

          test "$status" = "200" || {
            echo "Docker Hub answered $status." >&2
            echo "If that's 403 insufficient scope: DOCKERHUB_TOKEN needs to be" >&2
            echo "reissued on Docker Hub with \"Read, Write, Delete\" scope - the" >&2
            echo "\"Read & Write\" scope docker push needs is not enough for this." >&2
            exit 1
          }

      - name: Say where it went
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            printf '%s\n' '${{ steps.tags.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say why nothing happened
        if: env.HAS_DOCKERHUB != 'true'
        run: |
          {
            echo "### Docker Hub"
            echo
            echo "No DOCKERHUB_USERNAME is set, so nothing was pushed."
          } >> "$GITHUB_STEP_SUMMARY"
