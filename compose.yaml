# Production.
#
#   ddns config:init                        # or copy the example below
#   cp config/ddns.example.yaml config/ddns.yaml
#   cp .env.example .env                    # put the real secrets here
#   docker compose up -d
#
# That starts the HTTP endpoint. If you would rather poll from inside your
# network than expose an endpoint, run the watcher instead:
#
#   docker compose --profile watcher up -d
#
# Running both is harmless but redundant - pick whichever suits your network.
#
# For development use compose.dev.yaml instead.
#
# Requires Compose v2.24 or newer, for `env_file: required:`. Use the
# `docker compose` subcommand: the standalone `docker-compose` v1 reached end
# of life in July 2023 and cannot parse this file.

name: ddns

x-common: &common
  image: ${DDNS_IMAGE:-ddns:latest}
  build:
    context: .
    target: runtime
  restart: unless-stopped
  environment:
    DDNS_CONFIG: /config/ddns.yaml
    DDNS_LOG_LEVEL: ${DDNS_LOG_LEVEL:-INFO}
  env_file:
    - path: .env
      required: false
  volumes:
    # Long syntax with create_host_path disabled: if the file is missing,
    # Docker would otherwise silently create a *directory* with that name and
    # the container would fail with a confusing parse error.
    #
    # The same path inside and out, so `config/ddns.yaml` means one thing
    # whether you are looking at the host or at the container.
    - type: bind
      source: ./config/ddns.yaml
      target: /config/ddns.yaml
      read_only: true
      bind:
        create_host_path: false
  # The application never writes to disk, so it does not need to.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *common
    ports:
      # Bound to localhost by default: put a reverse proxy in front for TLS,
      # and set server.trusted_proxies in config/ddns.yaml when you do. Override with
      # DDNS_HTTP_BIND=0.0.0.0:8080 to expose it directly.
      - "${DDNS_HTTP_BIND:-127.0.0.1:8080}:8080"
    deploy:
      resources:
        limits:
          memory: 192M

  watcher:
    <<: *common
    profiles: ["watcher"]
    command: ["bin/ddns", "watch", "--all", "--interval", "${DDNS_WATCH_INTERVAL:-300}"]
    # No HTTP listener, so the image healthcheck does not apply.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M
