# Two ways to run the same application.
#
#   docker compose up server    HTTP endpoint on :8080
#   docker compose up watcher   polling loop, no ports exposed
#
# Both share one image and one configuration file; pick whichever suits your
# network. Running both at once is fine and harmless.

services:
  server:
    build: .
    image: ddns:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DDNS_CONFIG: /config/ddns.yaml
      DDNS_LOG_LEVEL: ${DDNS_LOG_LEVEL:-INFO}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./ddns.yaml:/config/ddns.yaml:ro

  watcher:
    build: .
    image: ddns:local
    restart: unless-stopped
    command: ["bin/ddns", "watch", "--all", "--interval", "300"]
    environment:
      DDNS_CONFIG: /config/ddns.yaml
      DDNS_LOG_LEVEL: ${DDNS_LOG_LEVEL:-INFO}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./ddns.yaml:/config/ddns.yaml:ro
